syntax = "proto3";

package agent;

option go_package = "vortex-edge/proto";

// ControlPlane is served by the control plane (cmd/vortex).
// Node agents call it to join the cluster and report liveness.
service ControlPlane {
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// NodeAgent is served by every worker (cmd/agent).
// The control plane calls it to run and manage workloads.
service NodeAgent {
    rpc Ping(PingRequest) returns (PingResponse);
    rpc RunService(RunServiceRequest) returns (RunServiceResponse);
    rpc StopService(StopServiceRequest) returns (StopServiceResponse);
    rpc DeleteService(DeleteServiceRequest) returns (DeleteServiceResponse);
    rpc Logs(LogsRequest) returns (LogsResponse);
   
}

message RegisterRequest {
    string node_id = 1;
    string name = 2;
    string address = 3;
    int32 cpu = 4;
    int64 memory = 5;
    int32 host_port = 6;
}

message RegisterResponse {
    bool accepted = 1;
}

message HeartbeatRequest {
    string node_id = 1;
}

message HeartbeatResponse {
    bool acknowledged = 1;
}
// Ping lets the control plane check that an endpoint is reachable
// AND that it is the node it expects (identity != address).
message PingRequest {}

message PingResponse {
    string node_id = 1;
}

message RunServiceResponse {
    bool started = 1;
    string container_id = 2;
}

message RunServiceRequest {
    string service_id = 1;
    string name = 2;
    string image = 3;
    int32 cpu = 4;
    int64 memory = 5;
    int32 host_port = 6;
}
message StopServiceRequest {
    string service_id = 1;
    string container_id = 2;
}

message StopServiceResponse {
    bool stopped = 1;
}

message DeleteServiceRequest {
    string service_id = 1;
    string container_id = 2;
}

message DeleteServiceResponse {
    bool deleted = 1;
}

message LogsRequest {
    string service_id = 1;
    string container_id = 2;
}

message LogsResponse {
    string logs = 1;
}